<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Bastion</title>
</head>
<body>
  <div id="stage" aria-label="Battlefield"></div>

  <div id="hud" class="hud" hidden>
    <div class="hud-row">
      <div class="lives" data-hud="lives" aria-label="Castle health"></div>
      <div class="wave" data-hud="wave">WAVE 1/3</div>
      <div class="gold"><i class="coin"></i><b data-hud="gold">100</b></div>
      <button class="mute" data-hud="mute" aria-pressed="false" aria-label="Sound">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path class="wave-line" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /><path class="cross" d="M16 9l6 6M22 9l-6 6" /></svg>
      </button>
    </div>
  </div>

  <div id="menu" class="menu" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <button id="cta" class="cta-mini"><b>BASTION</b><span>PLAY NOW</span></button>

  <div id="hand" class="hand" hidden>
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M24 8a5 5 0 0 1 10 0v21l3-.8a5 5 0 0 1 6 3l1-.3a5 5 0 0 1 6 3.4l.6-.2a5 5 0 0 1 6.4 4.6V50c0 7-6 12-13 12H32c-5 0-9-2-12-6L8 41a5 5 0 0 1 7-7l9 7z" />
    </svg>
    <span class="tip" data-hand="text">TAP TO BUILD</span>
  </div>

  <div id="flash" class="flash"></div>

  <div id="endcard" class="endcard" hidden>
    <div class="endcard-panel">
      <div class="logo">BASTION</div>
      <h1 data-end="title">VICTORY</h1>
      <p data-end="subtitle"></p>
      <span class="cta">PLAY FREE</span>
    </div>
  </div>

  <div id="debug" class="debug" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
